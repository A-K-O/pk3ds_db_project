name: Build

on:
  push:
  pull_request:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: pk3ds-db
          path: pk3ds-db.3dsx
          if-no-files-found: error
